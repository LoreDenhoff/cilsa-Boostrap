<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Contacto - TechStore</title>

  <!-- Bootstrap -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>

    body {
      background-color: #f4f7fb;
    }

    .encabezado {
      background-color: #172554;
    }

    .formulario {
      background-color: white;
    }

  </style>

</head>


<body>


  <!-- MENÚ -->

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

      <a
        class="navbar-brand fw-bold"
        href="index.html"
      >
        TechStore
      </a>


      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
        aria-controls="menu"
        aria-expanded="false"
        aria-label="Abrir menú"
      >

        <span class="navbar-toggler-icon"></span>

      </button>


      <div
        class="collapse navbar-collapse"
        id="menu"
      >

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">

            <a
              class="nav-link"
              href="index.html"
            >
              Inicio
            </a>

          </li>


          <li class="nav-item">

            <a
              class="nav-link"
              href="categorias.html"
            >
              Categorías
            </a>

          </li>


          <li class="nav-item">

            <a
              class="nav-link active"
              href="contacto.html"
            >
              Contacto
            </a>

          </li>

        </ul>

      </div>

    </div>

  </nav>


  <!-- ENCABEZADO -->

  <div class="container mt-4">

    <header
      class="encabezado text-white text-center py-4 rounded shadow"
    >

      <h1>Contacto</h1>

      <p class="mb-0">
        Estamos para ayudarte
      </p>

    </header>

  </div>


  <!-- FORMULARIO -->

  <main class="container my-5">

    <div class="row justify-content-center">

      <div class="col-sm-12 col-md-8 col-lg-6">


        <div class="formulario shadow rounded p-4">

          <h2 class="text-center text-primary mb-4">
            Escribinos
          </h2>


          <form>


            <!-- NOMBRE -->

            <div class="mb-3">

              <label
                for="nombre"
                class="form-label"
              >
                Nombre
              </label>

              <input
                type="text"
                class="form-control"
                id="nombre"
                name="nombre"
                placeholder="Ingresá tu nombre"
                required
                minlength="2"
              >

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

              <label
                for="email"
                class="form-label"
              >
                Email
              </label>

              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="ejemplo@email.com"
                required
              >

            </div>


            <!-- ASUNTO -->

            <div class="mb-3">

              <label
                for="asunto"
                class="form-label"
              >
                Asunto
              </label>

              <select
                class="form-select"
                id="asunto"
                name="asunto"
                required
              >

                <option value="">
                  Seleccioná una opción
                </option>

                <option value="producto">
                  Consulta sobre un producto
                </option>

                <option value="envio">
                  Consulta sobre envíos
                </option>

                <option value="otro">
                  Otro
                </option>

              </select>

            </div>


            <!-- MENSAJE -->

            <div class="mb-3">

              <label
                for="mensaje"
                class="form-label"
              >
                Mensaje
              </label>

              <textarea
                class="form-control"
                id="mensaje"
                name="mensaje"
                rows="5"
                placeholder="Escribí tu mensaje..."
                required
                minlength="10"
              ></textarea>

            </div>


            <!-- CHECK -->

            <div class="form-check mb-3">

              <input
                class="form-check-input"
                type="checkbox"
                id="terminos"
                required
              >

              <label
                class="form-check-label"
                for="terminos"
              >
                Acepto que mis datos sean utilizados para responder mi consulta.
              </label>

            </div>


            <!-- BOTÓN -->

            <div class="text-center">

              <button
                type="submit"
                class="btn btn-primary px-5"
              >
                Enviar mensaje
              </button>

            </div>


          </form>

        </div>

      </div>

    </div>

  </main>


  <!-- FOOTER -->

  <footer class="bg-dark text-white text-center py-4">

    <p class="mb-1">
      © 2026 TechStore - Todos los derechos reservados
    </p>

    <a
      href="index.html"
      class="text-white"
    >
      Volver al inicio
    </a>

  </footer>


  <!-- Bootstrap JavaScript -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>

</html>
